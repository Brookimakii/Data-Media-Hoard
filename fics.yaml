https://archiveofourown.org/works/84492496:
  title: The Boy Who Writes Himself
  summary: 'When Link was thrown into the distant past, he found a kingdom at the
    verge of war, rulers who took him in, and a Gerudo king who watched him far too
    closely.

    After a hundred years in a coma, Link''s memories had returned in fragments at
    first,  but never fully. Worse still, new ones did not settle the way they should.
    Faces blurred after a few days, names unraveled, and people he had just met could
    become strangers again if he was away from them too long.

    So Link wrote everything down. He had to. Without his notes, even the people he
    trusted would slip through his grasp.

    His notes about Ganondorf said:

    “Dangerous. Do not trust him.”

    Ganondorf changed one word.

    He told himself it was just an experiment, a way to stay close to the royal family,
    to study the secret stones before conquest.

    But Link began to look at him differently.

    And Ganondorf began to change in ways he did not understand.

    Because one day, Link would forget him completely.'
