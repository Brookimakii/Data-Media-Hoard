https://archiveofourown.org/works/84323356:
  title: Where Machines Learn to Bleed
  summary: 'Ramattra was built for war. Hana Song was raised by it.

    After his surrender, Ramattra is placed inside MEKA headquarters, not as a prisoner,
    but not quite as anything else either. Watched, managed, and never fully trusted,
    he’s given a role that feels almost ironic: protecting Hana Song, the same person
    who once saved him without ever knowing who he would become.

    Hana doesn’t want a bodyguard. Ramattra doesn’t know how to be anything but one.

    What starts as obligation turns into something quieter. Shared space. Late conversations.
    Small, human moments neither of them were meant to have. Hana clings to normalcy
    through music, performances, and stubborn independence. Ramattra tries to piece
    together an identity that isn’t built on violence. Somewhere in between, they
    begin to understand each other in ways neither of them expected.

    But peace is fragile. Talon is still watching, and the shadow of Null Sector hasn’t
    faded. As old wounds resurface and new threats close in, both of them are forced
    to confront what they’ve survived and what they’re willing to become.

    A story about healing, identity, and the strange, fragile space between machine
    and human.'
