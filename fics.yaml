    at a life worth living. Except that Link has no choice—her heart is ripped out
    of her chest without a moment of reprieve, and she is tossed by her grief into
    an entirely unstable unknown. However, it is now all that she has.

    As a soldier, Link is revered. She progresses quickly under the pretense that
