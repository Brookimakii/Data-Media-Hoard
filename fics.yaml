  title: Becoming like you
  summary: 'In a world where survival hinges on scavenging and trading omnic parts,
    a salvager ekes out a dangerous living, haunted by her debts to the powerful cartel
    that rules over her region. She’s skilled at picking through ruins for pieces
    to sell, but it’s never quite enough to pay off what she owes. Then, amidst the
    wreckage, she finds Ramattra—a former leader, nearly unrecognizable, broken and
    battered. He’s worth a small fortune on the black market, enough to clear her
    debts and free her from the cartel’s clutches.

    Yet something within her hesitates. She knows she should turn him in; he’s just
    another machine, right? But this is no ordinary omnic. Ramattra isn’t merely scrap
    metal but a lingering memory of the war that stole everything she had. Against
    her better judgment, she chooses to keep him hidden, slowly repairing him piece
    by piece. As she works, she senses something shifting within herself too—a forbidden
    empathy for this war-torn being and a dangerous defiance against the cartel’s
    grip. They might find out about her lie soon, and when they do, she’ll have to
    face her choice. But maybe, just maybe, Ramattra is worth the risk.'
