  title: mutually beneficial
  summary: '“Do we have a problem?” It was like a growl, a low simmer, augmented by
    the metallic filters on an omnic voicebox.

    Here was Ramattra, leaning his back casually against the wall, arms crossed across
    his chest. Instinctively, you’d clutched your bag to your heaving chest. How had
    you not noticed him? You hadn’t made it three steps down the hallway, but already
    walked right past him. It was almost as if he was waiting for you.

    Wait. Was he waiting for you?

    “S-sorry?” you stammered, barely having registered his words, let alone knowing
    how to respond.

    He took a step forward. Just the one stride was enough to bring him right near
    you, close enough that if he had breath you would feel it on your face. Your face
    flushed hot with nerves.

    Slowly, deliberately, as if he were speaking to a child, Ramattra said, “I asked
    you if we had a problem.”

    When Ramattra invites you to his room for a mutual observation of each others''
