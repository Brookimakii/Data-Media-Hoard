https://archiveofourown.org/works/84504361:
  title: Starfallen
  summary: 'Link hadn’t expected this cycle to be different—but it is.

    The Demon King he knows is gone. In his place stands a younger king—curious, compassionate,
    and utterly untouched by malice. Worse still, the immortal demon Link was created
    to destroy is nowhere to be found.

    With no enemy to hunt and only whispers of conflict brewing between Hyrule and
    Gerudo, Link is left with a purpose he no longer understands. A weapon without
    a target is useless, after all.

    Forced into an uneasy alliance, Link expects betrayal. Instead, he finds something
    far more unsettling: kindness.

    Ganondorf treats him as something more than the war machine he was built to be.
    Something Link cannot accept, and doesn’t know how to survive.

    Because if Ganondorf ever learns the truth—what Link really is beyond the Prototype
    he wears—there will be no kindness left to give.

    Link has endured nine cycles of war after he first defeated Demise. This is his
    tenth. And for the first time, he doesn’t know what he’s supposed to do.

    If only Sidon were still alive to help him through this.

    Story updates every Wednesday!'
