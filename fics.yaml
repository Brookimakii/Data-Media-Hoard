https://archiveofourown.org/works/84557721:
  title: The Afflicted
  summary: 'By the time Toronto fell, the world had already started dying.

    Nobody realized it at first. Strange attacks. Cities going dark. Emergency broadcasts
    began cutting out mid-sentence. Entire quarantine zones were disappearing overnight.
    Then came Toronto, where Overwatch and Null Sector both watched civilians tear
    each other apart in the streets while the dead refused to stay dead.

    Three months later, Hana Song survives in an abandoned outpost outside the city
    alongside Baptiste, Ashe, Cassidy, Sojourn, Soldier: 76, B.O.B., and Ramattra
    himself, the omnic leader who should have escaped during the chaos but stayed
    behind instead.

    Now the world beyond their walls grows quieter every day.

    Supplies are running low. Sleep comes hard. People are beginning to crack beneath
    grief, paranoia, and exhaustion.

    Hana still tries to believe her friends are alive somewhere out there. That Overwatch
    is rebuilding. That this nightmare can still end.

    But hope becomes harder to hold onto when the world keeps proving otherwise.

    And even harder when the person she trusts most is someone she was once taught
    to fear.'
