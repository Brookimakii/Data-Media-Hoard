https://archiveofourown.org/works/49439356:
  title: Above and Below
  summary: 'Neither Link or Zelda had a chance to respond before the mummy held its
    hands over its chest and gathered the smoke-like gloom that seeped from its chest.
    With a guttural roar, it raised its arms. The gloom surged upwards and violently
    collided with the cavern ceiling above.

    Zelda could only stare in horror before the ground cracked underneath her feet.
    She gasped, stumbled back, and fell backward. Link jumped after her, face twisted
    in panic and pain, and reached out to her with his damaged arm. They just brushed
    fingertips before Zelda felt herself come to an abrupt stop in the air, and Link
    fell past her. He twisted in the air, trying to grab onto her outstretched arm,
    but to no avail.

    “Link!” Zelda screamed, watching in horror as Link tumbled into the depths below,
    swallowed by the darkness.

    After that, she felt a tug on her arm, and the world went white.

    ——————

